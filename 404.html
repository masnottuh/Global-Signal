<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Global Signal</title>
    <meta name="description" content="That page is not on globalsignal.org.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0f0e">
    <link rel="canonical" href="https://www.globalsignal.org/404">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/images/watermark-1.png">
    <link rel="apple-touch-icon" href="/assets/images/social-watermark.png">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .not-found {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 640px;
            margin: 0 auto;
            padding: 120px var(--container-padding) var(--space-3xl);
        }
        .not-found h1 {
            margin: 0 0 var(--space-md);
        }
        .not-found p {
            color: var(--text-muted, #6b6e52);
            margin-bottom: var(--space-xl);
        }
        .not-found .hero-cta {
            justify-content: flex-start;
            gap: var(--space-md);
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <main class="not-found" id="main-content">
        <span class="section-tag">404</span>
        <h1>This page is not on the site</h1>
        <p>The address may be mistyped, or the page may have moved. The live pages are the homepage, the methodology, and the legal pages.</p>
        <div class="hero-cta">
            <a href="/" class="btn btn-primary">Back to the homepage</a>
            <a href="/methodology" class="btn btn-secondary">Read the method</a>
        </div>
    </main>
    <footer class="footer" role="contentinfo">
        <div class="container">
            <div class="footer-bottom">
                <p class="copyright">
                    &copy; 2026 Global Signal · globalsignal.org ·
                    <a href="/privacy.html">Privacy</a> ·
                    <a href="/terms.html">Terms</a>

            </div>
        </div>
    </footer>
</body>
</html>
